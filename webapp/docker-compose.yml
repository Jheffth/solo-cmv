services:
  db:
    image: postgres:15-alpine
    container_name: solo_cmv_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solo_cmv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-solo_cmv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - solo_cmv_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solo_cmv_app
    restart: always
    command: >
      sh -c "python preparar_banco.py &&
             uvicorn main:app --host 0.0.0.0 --port 8095
             --workers ${WEB_CONCURRENCY:-2}"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      PORT: ${PORT:-8095}
      HOST: ${HOST:-0.0.0.0}
      AMBIENTE: ${AMBIENTE:-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://solocmv.duckdns.org,http://localhost:8095,http://127.0.0.1:8095}
    depends_on:
      - db
    networks:
      - solo_cmv_net
      - solo-network

  # ==========================================================================
  # BACKUP DIÁRIO, VERIFICADO
  # ==========================================================================
  # Serviço próprio, e não um cron no host, por dois motivos: sobe junto com
  # o resto no `docker compose up`, e ninguém precisa lembrar de configurar
  # nada num servidor novo — que é justamente quando o backup costuma ficar
  # para trás.
  #
  # Usa a mesma imagem da aplicação porque a verificação precisa de Python e
  # SQLAlchemy: gerar o arquivo é fácil, provar que ele restaura é o que
  # importa. Ver o cabeçalho de backend/backup.py.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solo_cmv_backup
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      # Retenção em camadas: diários da semana, semanais do mês, mensais
      # do ano. Cobre 12 meses com menos arquivos que 30 diários cobriam 1 —
      # porque o erro que se percebe tarde é a ameaça real, não o incêndio.
      BACKUP_DIAS_DIARIOS: ${BACKUP_DIAS_DIARIOS:-7}
      BACKUP_SEMANAS: ${BACKUP_SEMANAS:-8}
      BACKUP_MESES: ${BACKUP_MESES:-12}
    volumes:
      - backups:/backups
    depends_on:
      - db
    networks:
      - solo_cmv_net
    # Um backup ao acordar (para o servidor novo já nascer com um) e depois
    # a cada 24 h. `sleep` em vez de cron: uma linha, sem daemon, e o
    # `restart: always` cuida de reerguer se cair.
    command: >
      sh -c "while true; do
               python backup.py || echo '[BACKUP] FALHOU — ver acima';
               sleep 86400;
             done"

networks:
  solo_cmv_net:
  solo-network:
    external: true

volumes:
  pgdata:
  # O backup PRECISA de volume próprio. Escrito no sistema de arquivos do
  # container, sumiria no próximo `docker compose up --build` — a mesma
  # armadilha da foto de perfil, e aqui infinitamente mais cara.
  #
  # Atenção: volume no MESMO servidor é meio backup. Se a máquina morrer,
  # morrem os dois. A cópia externa está em MIGRAR_SERVIDOR.md.
  backups:
