services:
  db:
    image: postgres:15-alpine
    container_name: solo_cmv_db
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-solo_cmv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-solo_cmv}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - solo_cmv_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solo_cmv_app
    restart: always
    command: >
      sh -c "python preparar_banco.py &&
             uvicorn main:app --host 0.0.0.0 --port 8095
             --workers ${WEB_CONCURRENCY:-2}"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      PORT: ${PORT:-8095}
      HOST: ${HOST:-0.0.0.0}
      AMBIENTE: ${AMBIENTE:-prod}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://solocmv.duckdns.org,http://localhost:8095,http://127.0.0.1:8095}
      BOT_SEGREDO: ${BOT_SEGREDO}
      EVOLUTION_API_URL: http://whatsapp:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-solo-cmv-evolution-key-2026}
    depends_on:
      - db
    networks:
      - solo_cmv_net
      - solo-network

  # ==========================================================================
  # BACKUP DIÁRIO, VERIFICADO
  # ==========================================================================
  # Serviço próprio, e não um cron no host, por dois motivos: sobe junto com
  # o resto no `docker compose up`, e ninguém precisa lembrar de configurar
  # nada num servidor novo — que é justamente quando o backup costuma ficar
  # para trás.
  #
  # Usa a mesma imagem da aplicação porque a verificação precisa de Python e
  # SQLAlchemy: gerar o arquivo é fácil, provar que ele restaura é o que
  # importa. Ver o cabeçalho de backend/backup.py.
  backup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solo_cmv_backup
    restart: always
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      BACKUP_DIR: /backups
      # Retenção em camadas: diários da semana, semanais do mês, mensais
      # do ano. Cobre 12 meses com menos arquivos que 30 diários cobriam 1 —
      # porque o erro que se percebe tarde é a ameaça real, não o incêndio.
      BACKUP_DIAS_DIARIOS: ${BACKUP_DIAS_DIARIOS:-7}
      BACKUP_SEMANAS: ${BACKUP_SEMANAS:-8}
      BACKUP_MESES: ${BACKUP_MESES:-12}
    volumes:
      - backups:/backups
    depends_on:
      - db
    networks:
      - solo_cmv_net
    # Um backup ao acordar (para o servidor novo já nascer com um) e depois
    # a cada 24 h. `sleep` em vez de cron: uma linha, sem daemon, e o
    # `restart: always` cuida de reerguer se cair.
    command: >
      sh -c "while true; do
               python backup.py || echo '[BACKUP] FALHOU — ver acima';
               sleep 86400;
             done"

  # ==========================================================================
  # BOT DO TELEGRAM
  # ==========================================================================
  # Processo próprio, e cliente HTTP da mesma API que o navegador usa — ver o
  # cabeçalho de bot/solo_api.py sobre por que ele NÃO importa os serviços
  # direto. Consequência boa: se o bot cair, o sistema web nem percebe.
  #
  # Não sobe sem token. Isso é desejável: um bot que sobe pela metade e não
  # responde é pior que um que não sobe, porque ninguém vai olhar o log.
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solo_cmv_bot
    restart: always
    working_dir: /app/bot
    command: ["python", "principal.py"]
    env_file:
      - .env
    environment:
      # O bot fala com a aplicação pela rede interna do compose — nunca pelo
      # domínio público. Sai mais rápido e não depende do Caddy estar de pé.
      SOLO_API: http://app:8095
      BOT_TELEGRAM_TOKEN: ${BOT_TELEGRAM_TOKEN}
      BOT_SEGREDO: ${BOT_SEGREDO}
      BOT_LOG: ${BOT_LOG:-INFO}
    depends_on:
      - app
    networks:
      - solo_cmv_net

  # ==========================================================================
  # GATEWAY WHATSAPP — EVOLUTION API v2 (Baileys)
  # ==========================================================================
  whatsapp:
    image: atendai/evolution-api:v2.2.3
    container_name: solo_cmv_whatsapp
    restart: always
    env_file:
      - .env
    environment:
      SERVER_TYPE: http
      SERVER_PORT: 8080
      SERVER_URL: http://whatsapp:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-solo-cmv-evolution-key-2026}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "false"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: http://app:8095/api/whatsapp/webhook
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      CONFIG_SESSION_PHONE_CLIENT: "Solo CMV"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      QRCODE_LIMIT: 30
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - solo_cmv_net

networks:
  solo_cmv_net:
  solo-network:
    external: true

volumes:
  pgdata:
  backups:
  evolution_instances:

